version: 2
updates:
  # Include repository-local composite actions, which the root scan does not cover.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Keep the independently shipped SA products in separate update PRs.
  - package-ecosystem: nuget
    directory: /targets/2026.1.0529.7
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /targets/2024.1.0508.5
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  # The SDK pin decides the runtime packs that self-contained packages bundle,
  # so .NET servicing releases arrive as global.json update PRs. A new .NET
  # major is a deliberate change, not a routine update.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /eng/publishing
    schedule:
      interval: weekly
    groups:
      publishing:
        patterns: ['*']
        update-types: [minor, patch]
