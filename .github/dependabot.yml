version: 2
updates:
  # Include repository-local composite actions, which the root scan does not cover.
  # The cooldown waits a week after an action release before proposing it.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # Keep the independently shipped SA products in separate update PRs.
  - package-ecosystem: nuget
    directory: /targets/2026.1.0529.7
    schedule:
      interval: weekly
    ignore:
      # Serilog.Extensions.Logging majors match the .NET major of their
      # Microsoft.Extensions.Logging dependency. Briosa targets .NET 10, and 11.x
      # would ship .NET 11 Microsoft.Extensions assemblies in place of the
      # runtime's (https://github.com/spatialanalyzer/briosa/issues/408).
      # Revisit when Briosa moves to .NET 11.
      - dependency-name: Serilog.Extensions.Logging
        versions: ['[11.0.0,12.0.0)']
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /targets/2024.1.0508.5
    schedule:
      interval: weekly
    ignore:
      # Same reason as the SA 2026.1.0529.7 entry: stay on the .NET 10 major.
      - dependency-name: Serilog.Extensions.Logging
        versions: ['[11.0.0,12.0.0)']
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  # The SDK pin decides the runtime packs that self-contained packages bundle,
  # so .NET servicing releases arrive as global.json update PRs. A new .NET
  # major is a deliberate change, not a routine update.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /eng/publishing
    schedule:
      interval: weekly
    ignore:
      # The pinned botocore (1.44.x) requires python-dateutil<3.0.0. Remove this
      # rule when the pinned botocore lifts that bound.
      - dependency-name: python-dateutil
        versions: ['>= 3.0.0']
    groups:
      publishing:
        patterns: ['*']
        update-types: [minor, patch]
