name: Release exact-target products

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Briosa semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Resolve Briosa version
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
      previous: ${{ steps.version.outputs.previous }}
      eligible: ${{ steps.version.outputs.eligible }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          else {
            $version = $env:DISPATCH_VERSION
          }

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not a supported semantic version."
          }
          $semanticVersion = $null
          if (-not [System.Management.Automation.SemanticVersion]::TryParse($version, [ref]$semanticVersion)) {
            throw "Version '$version' is not a supported semantic version."
          }

          # Only commits already on main may be signed or published.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/main."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
          $eligible = switch ($LASTEXITCODE) {
            0 { $true }
            1 { $false }
            default { throw "Could not determine whether $env:GITHUB_SHA is on main." }
          }
          if (-not $eligible) {
            if ("${{ github.event_name }}" -eq "push") {
              throw "Release tag $env:GITHUB_REF_NAME does not point to a commit on main."
            }
            Write-Host "::warning::$env:GITHUB_SHA is not on main; this dispatch is an unsigned dry run."
          }

          # The previous release is the highest stable v* tag reachable from the parent commit.
          $previous = ''
          $previousVersion = $null
          git rev-parse --verify --quiet "$env:GITHUB_SHA^" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $tags = @(git tag --merged "$env:GITHUB_SHA^" --list 'v[0-9]*')
            if ($LASTEXITCODE -ne 0) {
              throw "Could not list release tags before $env:GITHUB_SHA."
            }
            foreach ($tag in $tags) {
              $candidate = $null
              if ([System.Management.Automation.SemanticVersion]::TryParse($tag.Substring(1), [ref]$candidate) -and
                  [string]::IsNullOrEmpty($candidate.PreReleaseLabel) -and
                  ($null -eq $previousVersion -or $candidate -gt $previousVersion)) {
                $previous = $tag
                $previousVersion = $candidate
              }
            }
          }
          if ($null -ne $previousVersion -and $semanticVersion -le $previousVersion) {
            throw "Version $version is not greater than the previous stable release $previous."
          }
          Write-Host "Version $version; previous stable release: $(if ($previous) { $previous } else { 'none' }); eligible to sign: $eligible."

          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "previous=$previous" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "eligible=$($eligible.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  validate:
    name: Validate SA ${{ matrix.target.sa_version }} product
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - sa_version: 2026.1.0529.7
            path: targets/2026.1.0529.7
          - sa_version: 2024.1.0508.5
            path: targets/2024.1.0508.5

    defaults:
      run:
        working-directory: ${{ matrix.target.path }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'
      Briosa__Desktop__Mode: 'Disabled'

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '${{ matrix.target.path }}/**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore Briosa.slnx --locked-mode

      - name: Build interop inspector
        run: dotnet build tools/Briosa.InteropInspector/Briosa.InteropInspector.csproj -c Release --no-restore

      - name: Verify committed interop artifacts
        shell: pwsh
        run: ./eng/Verify-InteropArtifacts.ps1 -NoBuild

      - name: Verify protobuf contracts against the previous release
        shell: pwsh
        env:
          PROTOCOL_BASE_REF: ${{ needs.version.outputs.previous }}
        run: ./eng/Verify-Protocol.ps1 -AgainstRef $env:PROTOCOL_BASE_REF

      - name: Test reviewed MP naming compatibility exceptions
        shell: pwsh
        run: ../../eng/Test-MpArgumentNameMigrationPolicy.ps1 -TargetDirectory .

      - name: Build solution
        run: dotnet build Briosa.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test Briosa.slnx -c Release --no-build --no-restore --filter Category!=Performance

      - name: Verify development-only gRPC reflection and manual startup
        run: >-
          dotnet test tests/Briosa.Server.Tests/Briosa.Server.Tests.csproj
          -c Debug
          --no-restore
          --filter "FullyQualifiedName~DevelopmentGrpcReflectionTests|FullyQualifiedName~ManualServerStartupTests"

  package:
    name: Build SA ${{ matrix.target.sa_version }} products
    needs: [version, validate]
    runs-on: windows-latest
    timeout-minutes: 30
    # Matrix legs combine job outputs by name, so each target writes its own key.
    outputs:
      sha256_sa_2026_1_0529_7: ${{ steps.digest.outputs.sha256_sa_2026_1_0529_7 }}
      sha256_sa_2024_1_0508_5: ${{ steps.digest.outputs.sha256_sa_2024_1_0508_5 }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - sa_version: 2026.1.0529.7
            path: targets/2026.1.0529.7
          - sa_version: 2024.1.0508.5
            path: targets/2024.1.0508.5

    defaults:
      run:
        working-directory: ${{ matrix.target.path }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '${{ matrix.target.path }}/**/packages.lock.json'

      - name: Build twice and verify package
        shell: pwsh
        run: >
          ./eng/Test-WindowsPackage.ps1
          -Version "${{ needs.version.outputs.value }}"
          -OutputDirectory artifacts/release

      - name: Build twice and verify protocol artifact
        shell: pwsh
        run: >
          ./eng/Test-ProtocolArtifact.ps1
          -Version "${{ needs.version.outputs.value }}"
          -OutputDirectory artifacts/release

      - name: Build twice and verify client conformance artifact
        shell: pwsh
        run: >
          ./eng/Test-ClientConformancePackage.ps1
          -Version "${{ needs.version.outputs.value }}"
          -OutputDirectory artifacts/release

      - name: Run packaged client scenarios
        shell: pwsh
        run: >
          ./eng/Test-ClientScenarios.ps1
          -PackagePath "artifacts/release/briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.target.sa_version }}-win-x64.zip"

      - name: Record product archive digest
        id: digest
        shell: pwsh
        env:
          PRODUCT: briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.target.sa_version }}-win-x64.zip
          SA_VERSION: ${{ matrix.target.sa_version }}
        run: |
          $hash = (Get-FileHash -LiteralPath "artifacts/release/$env:PRODUCT" -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256_sa_$($env:SA_VERSION.Replace('.', '_'))=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "$env:PRODUCT SHA-256: $hash"

      - name: Upload exact-target release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.target.sa_version }}-release-assets
          path: ${{ matrix.target.path }}/artifacts/release/*
          if-no-files-found: error

      - name: Retain packaged server for published-client gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-server-${{ matrix.target.sa_version }}
          path: ${{ matrix.target.path }}/artifacts/release/briosa-client-conformance-*
          if-no-files-found: error

  retained-client-compatibility:
    needs: [version, package]
    uses: ./.github/workflows/retained-client-compatibility.yml
    with:
      server-version: ${{ needs.version.outputs.value }}

  sign:
    name: Sign SA ${{ matrix.sa_version }} product
    needs: [version, package, retained-client-compatibility]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.version.outputs.eligible == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - sa_version: 2026.1.0529.7
            digest_output: sha256_sa_2026_1_0529_7
          - sa_version: 2024.1.0508.5
            digest_output: sha256_sa_2024_1_0508_5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.sa_version }}-release-assets
          path: artifacts/unsigned
      - name: Verify transferred product digest
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs[matrix.digest_output] }}
          PRODUCT: briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.sa_version }}-win-x64.zip
        run: |
          if ($env:EXPECTED_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw "The package job did not record a SHA-256 digest for $env:PRODUCT."
          }
          $actual = (Get-FileHash -LiteralPath "artifacts/unsigned/$env:PRODUCT" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:EXPECTED_SHA256) {
            throw "$env:PRODUCT does not match the digest recorded by the package job."
          }
          Write-Host "$env:PRODUCT matches the package job digest $actual."
      - name: Sign verified Windows product
        id: sign
        uses: ./.github/actions/sign-package
        with:
          package-path: artifacts/unsigned/briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.sa_version }}-win-x64.zip
          staging-directory: artifacts/signing
          output-directory: artifacts/signed
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify final archive and retain developer artifacts
        shell: pwsh
        env:
          PRODUCT: briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.sa_version }}-win-x64
        run: |
          ./eng/Prepare-SignedPackage.ps1 -PackagePath "artifacts/signed/$env:PRODUCT.zip" -OutputDirectory artifacts/final-verification
          Import-Module ./eng/ReleasePackageSigning.psm1
          Assert-ReleaseSignatures "artifacts/final-verification/$env:PRODUCT" 'David Lucas'
          Get-ChildItem artifacts/unsigned -File | Where-Object { -not $_.Name.StartsWith($env:PRODUCT + '.') } | Copy-Item -Destination artifacts/signed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.sa_version }}-release-assets
          path: artifacts/signed/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, sign]
    runs-on: windows-latest
    # Both products include large self-contained developer bundles. The 0.6.0
    # upload exceeded ten minutes after building and signing successfully.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download all exact-target release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: briosa-${{ needs.version.outputs.value }}-sa-*-release-assets
          path: artifacts/release
          merge-multiple: true

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          $files = Get-ChildItem -LiteralPath artifacts/release -File |
            Sort-Object Name |
            ForEach-Object FullName
          if ($files.Count -eq 0) {
            throw "No exact-target release assets were downloaded."
          }

          $releaseArguments = @(
            "release",
            "create",
            $env:GITHUB_REF_NAME,
            "--verify-tag",
            "--generate-notes",
            "--title",
            "Briosa $env:PACKAGE_VERSION"
          )
          if ($env:PACKAGE_VERSION.Contains("-")) {
            $releaseArguments += "--prerelease"
          }

          & gh @releaseArguments @files
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed."
          }
