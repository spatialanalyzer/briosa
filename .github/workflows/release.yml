name: Release exact-target products

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Briosa semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Resolve Briosa version
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}

    steps:
      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          else {
            $version = $env:DISPATCH_VERSION
          }

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not a supported semantic version."
          }

          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  package:
    name: Build SA ${{ matrix.target.sa_version }} products
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - sa_version: 2026.1.0529.7
            path: targets/2026.1.0529.7
          - sa_version: 2024.1.0508.5
            path: targets/2024.1.0508.5

    defaults:
      run:
        working-directory: ${{ matrix.target.path }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '${{ matrix.target.path }}/**/packages.lock.json'

      - name: Build twice and verify package
        shell: pwsh
        run: >
          ./eng/Test-WindowsPackage.ps1
          -Version "${{ needs.version.outputs.value }}"
          -OutputDirectory artifacts/release

      - name: Build twice and verify protocol artifact
        shell: pwsh
        run: >
          ./eng/Test-ProtocolArtifact.ps1
          -Version "${{ needs.version.outputs.value }}"
          -OutputDirectory artifacts/release

      - name: Build twice and verify client conformance artifact
        shell: pwsh
        run: >
          ./eng/Test-ClientConformancePackage.ps1
          -Version "${{ needs.version.outputs.value }}"
          -OutputDirectory artifacts/release

      - name: Run packaged client scenarios
        shell: pwsh
        run: >
          ./eng/Test-ClientScenarios.ps1
          -PackagePath "artifacts/release/briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.target.sa_version }}-win-x64.zip"

      - name: Upload exact-target release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.target.sa_version }}-release-assets
          path: ${{ matrix.target.path }}/artifacts/release/*
          if-no-files-found: error

  sign:
    name: Sign SA ${{ matrix.sa_version }} product
    needs: [version, package]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        sa_version: [2026.1.0529.7, 2024.1.0508.5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.sa_version }}-release-assets
          path: artifacts/unsigned
      - name: Sign verified Windows product
        id: sign
        uses: ./.github/actions/sign-package
        with:
          package-path: artifacts/unsigned/briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.sa_version }}-win-x64.zip
          staging-directory: artifacts/signing
          output-directory: artifacts/signed
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify final archive and retain developer artifacts
        shell: pwsh
        env:
          PRODUCT: briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.sa_version }}-win-x64
        run: |
          ./eng/Prepare-SignedPackage.ps1 -PackagePath "artifacts/signed/$env:PRODUCT.zip" -OutputDirectory artifacts/final-verification
          Import-Module ./eng/ReleasePackageSigning.psm1
          Assert-ReleaseSignatures "artifacts/final-verification/$env:PRODUCT" 'David Lucas'
          Get-ChildItem artifacts/unsigned -File | Where-Object { -not $_.Name.StartsWith($env:PRODUCT + '.') } | Copy-Item -Destination artifacts/signed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: briosa-${{ needs.version.outputs.value }}-sa-${{ matrix.sa_version }}-release-assets
          path: artifacts/signed/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, sign]
    runs-on: windows-latest
    # Both products include large self-contained developer bundles. The 0.6.0
    # upload exceeded ten minutes after building and signing successfully.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all exact-target release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: briosa-${{ needs.version.outputs.value }}-sa-*-release-assets
          path: artifacts/release
          merge-multiple: true

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          $files = Get-ChildItem -LiteralPath artifacts/release -File |
            Sort-Object Name |
            ForEach-Object FullName
          if ($files.Count -eq 0) {
            throw "No exact-target release assets were downloaded."
          }

          $releaseArguments = @(
            "release",
            "create",
            $env:GITHUB_REF_NAME,
            "--verify-tag",
            "--generate-notes",
            "--title",
            "Briosa $env:PACKAGE_VERSION"
          )
          if ($env:PACKAGE_VERSION.Contains("-")) {
            $releaseArguments += "--prerelease"
          }

          & gh @releaseArguments @files
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed."
          }
