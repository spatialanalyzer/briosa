name: Client conformance soak

# Repeats one retained-client conformance job on hosted runners, against the server
# built from the dispatched commit, with every timeout diagnostic on (#450). Each
# iteration runs on its own runner. By default each scenario's HTTP/2 connection is
# also recorded at both ends, and kept for a failing scenario. It publishes, signs and releases nothing, uses
# no secrets and no environment, and calls only the retained-client workflow, never
# the release workflow.
on:
  workflow_dispatch:
    inputs:
      language:
        description: Client language
        required: true
        type: choice
        options:
          - js
          - dotnet
          - py
        default: js
      target:
        description: Exact SpatialAnalyzer target
        required: true
        type: choice
        options:
          - '2024.1.0508.5'
          - '2026.1.0529.7'
        default: '2024.1.0508.5'
      client-version:
        description: Retained client version, as compatibility/retained-clients.json lists it
        required: true
        type: string
        default: '0.5.1'
      iterations:
        description: Number of runs, 1 to 50, each on its own runner
        required: true
        type: number
        default: 20
      scenario:
        description: One scenario to repeat; leave empty to run every scenario of the job
        required: false
        type: string
        default: ''
      connection-capture:
        description: Record each scenario's HTTP/2 connection at both ends, and keep it for a failing scenario
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    name: Build the SA ${{ inputs.target }} conformance server
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A bad dispatch fails here, before anything is built. A number input reaches the
      # workflow as text and can hold a sign, a fraction, an exponent or leading zeroes,
      # which fromJSON rejects or reads differently, so the run count must be written as
      # a plain whole number from 1 to 50. Each input must pass a strict pattern before
      # anything prints it, since the runner reads workflow commands from this log: a
      # failure names the input, never its value. The client and scenario are then
      # planned exactly as the called workflow plans them.
      - name: Check the dispatch inputs
        shell: pwsh
        env:
          ITERATIONS: ${{ inputs.iterations }}
          LANGUAGE: ${{ inputs.language }}
          TARGET: ${{ inputs.target }}
          CLIENT_VERSION: ${{ inputs.client-version }}
          SOAK_SCENARIO: ${{ inputs.scenario }}
          CONNECTION_CAPTURE: ${{ inputs.connection-capture }}
        run: |
          if ($env:ITERATIONS -cnotmatch '\A(?:[1-9]|[1-4][0-9]|50)\z') {
            throw 'The iterations input must be a whole number from 1 to 50, without leading zeroes.'
          }
          if ($env:LANGUAGE -cnotmatch '\A(?:js|dotnet|py)\z') { throw 'The language input must be js, dotnet or py.' }
          if ($env:TARGET -cnotmatch '\A[0-9]+(?:\.[0-9]+){3}\z') { throw 'The target input must be an exact SpatialAnalyzer target.' }
          if ($env:CLIENT_VERSION -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?\z') {
            throw 'The client-version input must be a version, such as 0.5.1.'
          }
          if ($env:SOAK_SCENARIO -cnotmatch '\A(?:[a-z0-9]+(?:-[a-z0-9]+)*)?\z') {
            throw 'The scenario input must be empty or a scenario ID, such as capability-denied.'
          }
          if ($env:CONNECTION_CAPTURE -cnotmatch '\A(?:true|false)\z') { throw 'The connection-capture input must be true or false.' }
          $client = "$($env:LANGUAGE)/$($env:TARGET)/$($env:CLIENT_VERSION)"
          Import-Module ./eng/RetainedClientPolicy.psm1
          $plan = Get-RetainedClientMatrix -Path compatibility/retained-clients.json -ServerVersion 0.2.0-soak -AllowSourceCandidates
          $soak = Get-RetainedClientSoakMatrix -Plan $plan -Client $client -Iterations ([int]$env:ITERATIONS) -Scenario $env:SOAK_SCENARIO
          Write-Host "The soak will run $(@($soak.include).Count) iterations of $client."

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'targets/${{ inputs.target }}/**/packages.lock.json'

      # With a scenario, a soak package: its runner repeats that one scenario and ends
      # every run with an error, so no client script records it as compatibility evidence.
      # With the connection capture, its runner also records each scenario's HTTP/2
      # connection at both ends, keeps the records of a failing scenario with its
      # diagnostics, and likewise ends every run with an error.
      - name: Build the client conformance package
        shell: pwsh
        working-directory: targets/${{ inputs.target }}
        env:
          SOAK_SCENARIO: ${{ inputs.scenario }}
          CONNECTION_CAPTURE: ${{ inputs.connection-capture }}
        run: |
          $soak = @{}
          if (-not [string]::IsNullOrEmpty($env:SOAK_SCENARIO)) { $soak.SoakScenario = $env:SOAK_SCENARIO }
          if ($env:CONNECTION_CAPTURE -ceq 'true') { $soak.ConnectionCapture = $true }
          ./eng/New-ClientConformancePackage.ps1 -Version 0.2.0-soak -SourceRevision $env:GITHUB_SHA -OutputDirectory artifacts/client-conformance-soak @soak

      - name: Keep the package for the soak jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-server-${{ inputs.target }}
          path: targets/${{ inputs.target }}/artifacts/client-conformance-soak/briosa-client-conformance-*
          if-no-files-found: error
          retention-days: 7

  soak:
    needs: package
    uses: ./.github/workflows/retained-client-compatibility.yml
    with:
      server-version: 0.2.0-soak
      allow-source-candidates: true
      # A workflow_dispatch number input reaches the inputs context as a string, and
      # the called workflow's soak-iterations is a number, so the value is parsed.
      soak-iterations: ${{ fromJSON(inputs.iterations) }}
      soak-client: ${{ inputs.language }}/${{ inputs.target }}/${{ inputs.client-version }}
      soak-scenario: ${{ inputs.scenario }}

  summary:
    name: Summarise the soak
    needs: soak
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Download the iteration results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: soak-result-*
          path: soak-results

      - name: Write the summary
        shell: pwsh
        env:
          ITERATIONS: ${{ inputs.iterations }}
          LANGUAGE: ${{ inputs.language }}
          TARGET: ${{ inputs.target }}
          CLIENT_VERSION: ${{ inputs.client-version }}
          SCENARIO: ${{ inputs.scenario }}
          CONNECTION_CAPTURE: ${{ inputs.connection-capture }}
          SOAK_RESULT: ${{ needs.soak.result }}
          DOWNLOAD: ${{ steps.download.outcome }}
        run: |
          # One valid result per requested iteration; a missing, unreadable, repeated or
          # unsuccessful one fails the soak. The inputs are printed only once they pass
          # the package job's strict patterns; a rejected value is never echoed, since the
          # runner reads workflow commands from this log.
          if ($env:ITERATIONS -cnotmatch '\A(?:[1-9]|[1-4][0-9]|50)\z' -or
              $env:LANGUAGE -cnotmatch '\A(?:js|dotnet|py)\z' -or
              $env:TARGET -cnotmatch '\A[0-9]+(?:\.[0-9]+){3}\z' -or
              $env:CLIENT_VERSION -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?\z' -or
              $env:SCENARIO -cnotmatch '\A(?:[a-z0-9]+(?:-[a-z0-9]+)*)?\z' -or
              $env:CONNECTION_CAPTURE -cnotmatch '\A(?:true|false)\z') {
            'The dispatch inputs were not valid, so no iteration ran.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw 'The dispatch inputs were not valid; the package job names the input that failed.'
          }
          $requested = [int]$env:ITERATIONS
          $results = @{}
          $invalid = 0
          foreach ($file in @(Get-ChildItem -Path soak-results -Recurse -Filter soak-result.json -File -ErrorAction SilentlyContinue)) {
            try {
              $result = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
              $iteration = [int]$result.iteration
              if ($iteration -lt 1 -or $iteration -gt $requested -or $results.ContainsKey($iteration) -or
                  $result.status -isnot [string]) { throw 'invalid' }
              $results[$iteration] = $result
            }
            catch { $invalid++ }
          }
          $passed = @($results.Values | Where-Object { $_.status -ceq 'success' }).Count
          $lines = [Collections.Generic.List[string]]::new()
          $lines.Add('## Client conformance soak')
          $lines.Add('')
          $lines.Add(('Client {0} {1} on SA {2}, {3}; {4} of {5} iterations passed.' -f $env:LANGUAGE, $env:CLIENT_VERSION, $env:TARGET,
            $(if ($env:SCENARIO) { "scenario $($env:SCENARIO)" } else { 'every scenario of the job' }), $passed, $requested))
          $lines.Add('')
          $lines.Add($(if ($env:CONNECTION_CAPTURE -ceq 'true') {
                'Each scenario''s HTTP/2 connection was recorded at both ends; a failing scenario keeps client-connection.jsonl, the server log and connection-timeline.txt.'
              } else { 'The HTTP/2 connection was not recorded.' }))
          $lines.Add('')
          $lines.Add('| Iteration | Outcome | Failed scenarios |')
          $lines.Add('| ---: | --- | --- |')
          for ($iteration = 1; $iteration -le $requested; $iteration++) {
            $result = $results[$iteration]
            if ($null -eq $result) {
              $lines.Add("| $iteration | no result |  |")
              continue
            }
            $failed = (@($result.failed) | ForEach-Object { "$($_.scenario)$(if ($_.timedOut) { ' (timed out)' })" }) -join ', '
            $lines.Add("| $iteration | $($result.status) | $failed |")
          }
          $lines.Add('')
          if ($env:DOWNLOAD -cne 'success') {
            $lines.Add('The iteration results could not be downloaded, so the iterations above have no result.')
          }
          if ($invalid -gt 0) {
            $lines.Add("$invalid result files were unreadable, repeated or out of range and were not counted.")
          }
          $lines.Add('A failing iteration keeps its diagnostics as the artifact conformance-diagnostics-<language>-<target>-<version>-iteration-<n>.')
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($env:DOWNLOAD -cne 'success') { throw 'The soak iteration results could not be downloaded.' }
          if ($results.Count -ne $requested -or $passed -ne $requested -or $invalid -gt 0 -or $env:SOAK_RESULT -cne 'success') {
            throw "The soak did not pass every iteration ($passed of $requested passed, $($results.Count) results)."
          }
