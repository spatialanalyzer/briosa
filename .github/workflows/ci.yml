name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository workflow policy
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify ordinary CI workflow policy
        shell: pwsh
        run: ./eng/Verify-CiWorkflow.ps1

      - name: Verify licensed runner workflow policy
        shell: pwsh
        run: ./eng/Verify-LicensedRunnerWorkflow.ps1

      - name: Verify exact-target product isolation
        shell: pwsh
        run: ./eng/Verify-TargetIsolation.ps1

  build-and-test:
    name: SA ${{ matrix.target.sa_version }} Windows x64 build and test
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - sa_version: 2026.1.0529.7
            path: targets/2026.1.0529.7

    defaults:
      run:
        working-directory: ${{ matrix.target.path }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '${{ matrix.target.path }}/**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore Briosa.slnx --locked-mode

      - name: Verify local SpatialAnalyzer source-host composition
        shell: pwsh
        run: ./eng/Test-LocalSpatialAnalyzerHost.ps1 -NoRestore

      - name: Build interop inspector
        run: dotnet build tools/Briosa.InteropInspector/Briosa.InteropInspector.csproj -c Release --no-restore

      - name: Verify protobuf contracts
        shell: pwsh
        run: ./eng/Verify-Protocol.ps1

      - name: Build solution
        run: dotnet build Briosa.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test Briosa.slnx -c Release --no-build --no-restore

      - name: Verify development-only gRPC reflection
        run: >-
          dotnet test tests/Briosa.Server.Tests/Briosa.Server.Tests.csproj
          -c Debug
          --no-restore
          --filter FullyQualifiedName~DevelopmentGrpcReflectionTests

      - name: Measure vendor-independent runtime performance
        shell: pwsh
        run: ./eng/Test-RuntimePerformance.ps1 -NoBuild

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-performance-evidence-sa-${{ matrix.target.sa_version }}
          path: ${{ matrix.target.path }}/artifacts/ci-metrics/runtime-performance
          if-no-files-found: warn

  package-smoke:
    name: SA ${{ matrix.target.sa_version }} package and protocol smoke
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - sa_version: 2026.1.0529.7
            path: targets/2026.1.0529.7

    defaults:
      run:
        working-directory: ${{ matrix.target.path }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '${{ matrix.target.path }}/**/packages.lock.json'

      - name: Build twice and verify package
        shell: pwsh
        run: ./eng/Test-WindowsPackage.ps1 -Version 0.1.0-ci

      - name: Build twice and verify protocol artifact
        shell: pwsh
        run: ./eng/Test-ProtocolArtifact.ps1 -Version 0.2.0-ci

      - name: Run packaged client scenarios
        shell: pwsh
        run: >
          ./eng/Test-ClientScenarios.ps1
          -PackagePath artifacts/package-smoke/briosa-0.1.0-ci-sa-${{ matrix.target.sa_version }}-win-x64.zip

  required-build-and-test:
    name: Windows x64 build and test
    if: ${{ always() }}
    needs:
      - repository-policy
      - build-and-test
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Require repository policy and every target build and test job
        shell: pwsh
        env:
          REPOSITORY_POLICY_RESULT: ${{ needs.repository-policy.result }}
          BUILD_AND_TEST_RESULT: ${{ needs.build-and-test.result }}
        run: |
          if ($env:REPOSITORY_POLICY_RESULT -ne 'success') {
            throw "Repository workflow policy finished with '$env:REPOSITORY_POLICY_RESULT'."
          }

          if ($env:BUILD_AND_TEST_RESULT -ne 'success') {
            throw "One or more target build and test jobs finished with '$env:BUILD_AND_TEST_RESULT'."
          }

  required-package-smoke:
    name: Windows package reproducibility and smoke test
    if: ${{ always() }}
    needs:
      - package-smoke
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Require every target package and protocol smoke job
        shell: pwsh
        env:
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          if ($env:PACKAGE_SMOKE_RESULT -ne 'success') {
            throw "One or more target package and protocol smoke jobs finished with '$env:PACKAGE_SMOKE_RESULT'."
          }
