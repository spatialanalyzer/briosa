name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository workflow policy
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify ordinary CI workflow policy
        shell: pwsh
        run: ./eng/Verify-CiWorkflow.ps1

      - name: Verify licensed runner workflow policy
        shell: pwsh
        run: |
          ./eng/Verify-LicensedRunnerWorkflow.ps1
          ./eng/Verify-LicensedRunnerWorkflow.ps1 -SpatialAnalyzerVersion 2024.1.0508.5

      - name: Verify exact-target product isolation
        shell: pwsh
        run: ./eng/Verify-TargetIsolation.ps1

      - name: Test mirrorable release catalog producer
        shell: pwsh
        run: ./eng/Test-ReleaseCatalog.ps1

      - name: Test dependency snapshot generation
        shell: pwsh
        run: ./eng/Test-DependencySnapshot.ps1

      - name: Test signing boundaries without production credentials
        shell: pwsh
        run: ./eng/Test-ReleaseSigning.ps1

      - name: Verify retained-client bootstrap boundary
        shell: pwsh
        run: |
          ./eng/Test-RetainedClientPolicy.ps1
          ./eng/Test-CompatibilityMatrix.ps1
          ./eng/Test-CompatibilityMatrixPolicy.ps1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Test R2 publication boundaries without production credentials
        shell: pwsh
        run: python -m unittest discover -s eng/publishing -p test_*.py

  build-and-test:
    name: SA ${{ matrix.target.sa_version }} Windows x64 build and test
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - sa_version: 2026.1.0529.7
            path: targets/2026.1.0529.7
          - sa_version: 2024.1.0508.5
            path: targets/2024.1.0508.5

    defaults:
      run:
        working-directory: ${{ matrix.target.path }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'
      Briosa__Desktop__Mode: 'Disabled'

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '${{ matrix.target.path }}/**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore Briosa.slnx --locked-mode

      - name: Verify local SpatialAnalyzer source-host composition
        shell: pwsh
        run: ./eng/Test-LocalSpatialAnalyzerHost.ps1 -NoRestore

      - name: Verify Control Center layout and state controls
        shell: pwsh
        run: dotnet run --project tests/Briosa.ControlCenter.Smoke -c Release --no-restore -- artifacts/control-center-ui

      - name: Build interop inspector
        run: dotnet build tools/Briosa.InteropInspector/Briosa.InteropInspector.csproj -c Release --no-restore

      - name: Verify protobuf contracts
        shell: pwsh
        env:
          PROTOCOL_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./eng/Verify-Protocol.ps1 -AgainstRef $env:PROTOCOL_BASE_REF

      - name: Build solution
        run: dotnet build Briosa.slnx -c Release --no-restore

      - name: Run tests
        run: >-
          dotnet test Briosa.slnx -c Release --no-build --no-restore
          --collect:"XPlat Code Coverage"
          --settings ../../eng/coverage.runsettings
          --results-directory artifacts/test-results
          --logger trx

      - name: Summarize handwritten code coverage
        if: always()
        shell: pwsh
        run: |
          $summary = ../../eng/Write-CoverageSummary.ps1 -ResultsDirectory artifacts/test-results
          $summary | Out-File -FilePath artifacts/test-results/coverage-summary.md -Encoding utf8
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-sa-${{ matrix.target.sa_version }}
          path: ${{ matrix.target.path }}/artifacts/test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Verify development-only gRPC reflection
        run: >-
          dotnet test tests/Briosa.Server.Tests/Briosa.Server.Tests.csproj
          -c Debug
          --no-restore
          --filter FullyQualifiedName~DevelopmentGrpcReflectionTests

      - name: Measure vendor-independent runtime performance
        shell: pwsh
        run: ./eng/Test-RuntimePerformance.ps1 -NoBuild

      - name: Measure bounded logging pipeline
        shell: pwsh
        run: ./eng/Test-ObservabilityPerformance.ps1 -NoBuild

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-performance-evidence-sa-${{ matrix.target.sa_version }}
          path: |
            ${{ matrix.target.path }}/artifacts/ci-metrics/runtime-performance
            ${{ matrix.target.path }}/artifacts/ci-metrics/observability
          if-no-files-found: warn

  package-smoke:
    name: SA ${{ matrix.target.sa_version }} package and protocol smoke
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - sa_version: 2026.1.0529.7
            path: targets/2026.1.0529.7
          - sa_version: 2024.1.0508.5
            path: targets/2024.1.0508.5

    defaults:
      run:
        working-directory: ${{ matrix.target.path }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'
      Briosa__Desktop__Mode: 'Disabled'

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '${{ matrix.target.path }}/**/packages.lock.json'

      - name: Build twice and verify package
        shell: pwsh
        run: ./eng/Test-WindowsPackage.ps1 -Version 0.1.0-ci

      - name: Build twice and verify protocol artifact
        shell: pwsh
        run: ./eng/Test-ProtocolArtifact.ps1 -Version 0.2.0-ci

      - name: Build twice and verify client conformance artifact
        shell: pwsh
        run: ./eng/Test-ClientConformancePackage.ps1 -Version 0.2.0-ci

      - name: Retain packaged server for published-client gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-server-${{ matrix.target.sa_version }}
          path: ${{ matrix.target.path }}/artifacts/client-conformance-smoke/briosa-client-conformance-*
          if-no-files-found: error

      - name: Run packaged client scenarios
        shell: pwsh
        run: >
          ./eng/Test-ClientScenarios.ps1
          -PackagePath artifacts/package-smoke/briosa-0.1.0-ci-sa-${{ matrix.target.sa_version }}-win-x64.zip

  retained-client-compatibility:
    needs: package-smoke
    uses: ./.github/workflows/retained-client-compatibility.yml
    with:
      server-version: 0.2.0-ci
      pull-request-bootstrap: true
