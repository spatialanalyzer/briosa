name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows x64 build and test
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify ordinary CI workflow policy
        shell: pwsh
        run: ./eng/Verify-CiWorkflow.ps1

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Verify licensed runner workflow policy
        shell: pwsh
        run: ./eng/Verify-LicensedRunnerWorkflow.ps1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          ./eng/Measure-CiBudget.ps1 `
            -Metric restore `
            -Executable dotnet `
            -ArgumentList @("restore", "Briosa.slnx", "--locked-mode")

      - name: Build interop verifier
        run: dotnet build tools/Briosa.Generator/Briosa.Generator.csproj -c Release --no-restore

      - name: Verify deterministic full surface
        shell: pwsh
        run: |
          ./eng/Measure-CiBudget.ps1 `
            -Metric generation `
            -Executable pwsh `
            -ArgumentList @(
              "-NoLogo",
              "-NoProfile",
              "-File",
              "./eng/Verify-FullSurface.ps1",
              "-NoBuild")

      - name: Build solution
        shell: pwsh
        run: |
          ./eng/Measure-CiBudget.ps1 `
            -Metric compile `
            -Executable dotnet `
            -ArgumentList @(
              "build",
              "Briosa.slnx",
              "-c",
              "Release",
              "--no-restore")

      - name: Run tests
        shell: pwsh
        run: |
          ./eng/Measure-CiBudget.ps1 `
            -Metric test `
            -Executable dotnet `
            -ArgumentList @(
              "test",
              "Briosa.slnx",
              "-c",
              "Release",
              "--no-build",
              "--no-restore")

      - name: Upload build metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-surface-build-metrics
          path: |
            artifacts/ci-metrics
            artifacts/full-surface
          if-no-files-found: warn

  package-smoke:
    name: Windows package reproducibility and smoke test
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build twice and verify package
        shell: pwsh
        run: |
          ./eng/Measure-CiBudget.ps1 `
            -Metric package `
            -Executable pwsh `
            -ArgumentList @(
              "-NoLogo",
              "-NoProfile",
              "-File",
              "./eng/Test-WindowsPackage.ps1",
              "-Version",
              "0.1.0-ci") `
            -OutputDirectory artifacts/ci-metrics/package-smoke

      - name: Build twice and verify protocol artifact
        shell: pwsh
        run: ./eng/Test-ProtocolArtifact.ps1 -Version 0.2.0-ci

      - name: Run packaged generated-client scenarios
        shell: pwsh
        run: >
          ./eng/Test-GeneratedClientScenarios.ps1
          -PackagePath artifacts/package-smoke/briosa-0.1.0-ci-sa-2026.1.0529.7-win-x64.zip

      - name: Upload package metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-surface-package-metrics
          path: artifacts/ci-metrics
          if-no-files-found: warn
