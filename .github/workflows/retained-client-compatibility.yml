name: Client compatibility and rejection
on:
  workflow_call:
    inputs:
      server-version:
        required: true
        type: string
      allow-source-candidates:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  policy:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: policy
        shell: pwsh
        env:
          SERVER_VERSION: ${{ inputs.server-version }}
          ALLOW_SOURCE_CANDIDATES: ${{ inputs.allow-source-candidates }}
        run: |
          Import-Module ./eng/RetainedClientPolicy.psm1
          $plan = Get-RetainedClientMatrix -Path compatibility/retained-clients.json -ServerVersion $env:SERVER_VERSION -AllowSourceCandidates:($env:ALLOW_SOURCE_CANDIDATES -eq 'true')
          "matrix=$(@{ include = @($plan.include) } | ConvertTo-Json -Depth 8 -Compress)" >> $env:GITHUB_OUTPUT
  conformance:
    needs: policy
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.fixtureSourceRevision }}
          path: retained-client
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compatibility-server-${{ matrix.target }}
          path: server-artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'dotnet'
        with:
          global-json-file: retained-client/targets/${{ matrix.target }}/global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.language == 'js'
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.language == 'py'
        with:
          python-version: '3.12'
      - name: Install fixture tooling
        if: matrix.language == 'js'
        working-directory: retained-client/targets/${{ matrix.target }}
        run: npm ci --ignore-scripts
      - name: Build source candidate package
        if: matrix.published == false
        working-directory: retained-client/targets/${{ matrix.target }}
        shell: pwsh
        env:
          CLIENT_LANGUAGE: ${{ matrix.language }}
        run: |
          switch ($env:CLIENT_LANGUAGE) {
            'dotnet' {
              dotnet restore Briosa.DotNet.slnx --locked-mode
              if ($LASTEXITCODE -ne 0) { throw 'Candidate restore failed.' }
              dotnet pack src/Briosa.Client/Briosa.Client.csproj -c Release --no-restore -o artifacts/package
              if ($LASTEXITCODE -ne 0) { throw 'Candidate pack failed.' }
            }
            'js' {
              npm run build
              if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed.' }
              npm pack
              if ($LASTEXITCODE -ne 0) { throw 'Candidate pack failed.' }
            }
            'py' {
              python -m pip install build==1.2.2.post1
              if ($LASTEXITCODE -ne 0) { throw 'Candidate tooling install failed.' }
              python -m build
              if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed.' }
            }
            default { throw 'Unknown client language.' }
          }
      - name: Verify and exercise package
        shell: pwsh
        env:
          CLIENT_URL: ${{ matrix.url }}
          CLIENT_FILE: ${{ matrix.fileName }}
          CLIENT_SHA: ${{ matrix.sha256 }}
          CLIENT_VERSION: ${{ matrix.version }}
          CLIENT_REVISION: ${{ matrix.sourceRevision }}
          CLIENT_LANGUAGE: ${{ matrix.language }}
          CLIENT_PUBLISHED: ${{ matrix.published }}
          EXPECT_INCOMPATIBLE: ${{ matrix.expectIncompatible }}
          CLIENT_CONTRACT_MAJOR: ${{ matrix.requiredContract.major }}
          SA_TARGET: ${{ matrix.target }}
          SERVER_VERSION: ${{ inputs.server-version }}
        run: |
          if ($env:CLIENT_PUBLISHED -eq 'true') {
            $package = Join-Path $PWD $env:CLIENT_FILE
            Invoke-WebRequest $env:CLIENT_URL -OutFile $package
            if ((Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:CLIENT_SHA) { throw 'Client artifact digest mismatch.' }
          }
          else {
            $pattern = @{ dotnet = 'artifacts/package/*.nupkg'; js = '*.tgz'; py = 'dist/*.whl' }[$env:CLIENT_LANGUAGE]
            $packages = @(Get-ChildItem "retained-client/targets/$env:SA_TARGET/$pattern" -File)
            if ($packages.Count -ne 1) { throw 'Expected one source candidate package.' }
            $package = $packages[0].FullName
            $env:CLIENT_SHA = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $name = "briosa-client-conformance-$env:SERVER_VERSION-sa-$env:SA_TARGET-win-x64"
          $artifact = Join-Path $PWD "server-artifacts/$name.zip"
          $provenance = Get-Content "server-artifacts/$name.provenance.json" -Raw | ConvertFrom-Json
          if ($provenance.sourceRevision -cne $env:GITHUB_SHA -or $provenance.briosaVersion -cne $env:SERVER_VERSION -or $provenance.spatialAnalyzerTarget -cne $env:SA_TARGET) {
            throw 'Conformance product does not belong to this server build.'
          }
          $lock = @{
            schema_version = 1
            artifact = @{
              name = $name; file_name = "$name.zip"; sha256 = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
              briosa_version = $provenance.briosaVersion; source_revision = $provenance.sourceRevision
              source_repository = 'https://github.com/spatialanalyzer/briosa'; source_channel = 'release_candidate'
            }
            target = @{ spatial_analyzer = $env:SA_TARGET; runtime_identifier = 'win-x64' }
            contract = @{ id = $provenance.scenarioContract; schema_version = $provenance.scenarioContractSchemaVersion }
          }
          $lockPath = Join-Path $PWD 'server-lock.json'
          $lock | ConvertTo-Json -Depth 10 | Set-Content $lockPath -Encoding utf8
          $arguments = @{
            ClientPackagePath = $package; ClientPackageSha256 = $env:CLIENT_SHA; ClientVersion = $env:CLIENT_VERSION
            PublishedPackageUrl = $env:CLIENT_URL; ArtifactPath = $artifact; LockPath = $lockPath
            EvidencePath = (Join-Path $PWD 'compatibility-evidence.json')
            ClientSourceRevision = $env:CLIENT_REVISION
            RequiredContractMajor = [int]$env:CLIENT_CONTRACT_MAJOR
            ExpectIncompatible = $env:EXPECT_INCOMPATIBLE -eq 'true'
          }
          # Fixture source and package source are separately pinned. The fixture
          # uses the public API from an isolated verified package installation.
          Push-Location (Join-Path $PWD "retained-client/targets/$env:SA_TARGET")
          try { & ./eng/Test-PublishedClientConformance.ps1 @arguments }
          finally { Pop-Location }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-${{ matrix.language }}-${{ matrix.target }}-${{ matrix.version }}
          path: compatibility-evidence.json
          if-no-files-found: error
          retention-days: 90
  gate:
    needs: [policy, conformance]
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          POLICY: ${{ needs.policy.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
        run: |
          if ($env:POLICY -ne 'success' -or $env:CONFORMANCE -ne 'success') {
            throw 'Retained-client compatibility gate failed.'
          }
