name: Client compatibility and rejection
on:
  workflow_call:
    inputs:
      server-version:
        required: true
        type: string
      allow-source-candidates:
        default: false
        type: boolean
      # The soak run (conformance-soak.yml) repeats one job of this plan with every
      # diagnostic on (#450). Zero, the default, is the gate.
      soak-iterations:
        default: 0
        type: number
      # language/target/version of the one job a soak run repeats.
      soak-client:
        default: ''
        type: string
      # One scenario a soak run repeats, or empty for every scenario of the job.
      soak-scenario:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  policy:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: policy
        shell: pwsh
        env:
          SERVER_VERSION: ${{ inputs.server-version }}
          ALLOW_SOURCE_CANDIDATES: ${{ inputs.allow-source-candidates }}
          SOAK_ITERATIONS: ${{ inputs.soak-iterations }}
          SOAK_CLIENT: ${{ inputs.soak-client }}
          SOAK_SCENARIO: ${{ inputs.soak-scenario }}
        run: |
          Import-Module ./eng/RetainedClientPolicy.psm1
          $plan = Get-RetainedClientMatrix -Path compatibility/retained-clients.json -ServerVersion $env:SERVER_VERSION -AllowSourceCandidates:($env:ALLOW_SOURCE_CANDIDATES -eq 'true')
          if ([int]$env:SOAK_ITERATIONS -ne 0) {
            $plan = Get-RetainedClientSoakMatrix -Plan $plan -Client $env:SOAK_CLIENT -Iterations ([int]$env:SOAK_ITERATIONS) -Scenario $env:SOAK_SCENARIO
          }
          elseif ($env:SOAK_CLIENT -or $env:SOAK_SCENARIO) {
            throw 'A soak client or scenario needs soak iterations.'
          }
          "matrix=$(@{ include = @($plan.include) } | ConvertTo-Json -Depth 8 -Compress)" >> $env:GITHUB_OUTPUT
  conformance:
    needs: policy
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.fixtureSourceRevision }}
          path: retained-client
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compatibility-server-${{ matrix.target }}
          path: server-artifacts
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: matrix.language == 'dotnet'
        with:
          global-json-file: retained-client/targets/${{ matrix.target }}/global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'js'
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.language == 'py'
        with:
          python-version: '3.12'
      - name: Install fixture tooling
        if: matrix.language == 'js'
        working-directory: retained-client/targets/${{ matrix.target }}
        run: npm ci --ignore-scripts
      - name: Build source candidate package
        if: matrix.published == false
        working-directory: retained-client/targets/${{ matrix.target }}
        shell: pwsh
        env:
          CLIENT_LANGUAGE: ${{ matrix.language }}
        run: |
          switch ($env:CLIENT_LANGUAGE) {
            'dotnet' {
              dotnet restore Briosa.DotNet.slnx --locked-mode
              if ($LASTEXITCODE -ne 0) { throw 'Candidate restore failed.' }
              dotnet pack src/Briosa.Client/Briosa.Client.csproj -c Release --no-restore -o artifacts/package
              if ($LASTEXITCODE -ne 0) { throw 'Candidate pack failed.' }
            }
            'js' {
              npm run build
              if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed.' }
              npm pack
              if ($LASTEXITCODE -ne 0) { throw 'Candidate pack failed.' }
            }
            'py' {
              python -m pip install build==1.2.2.post1
              if ($LASTEXITCODE -ne 0) { throw 'Candidate tooling install failed.' }
              python -m build
              if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed.' }
            }
            default { throw 'Unknown client language.' }
          }
      - name: Verify and exercise package
        id: verify
        shell: pwsh
        env:
          CLIENT_URL: ${{ matrix.url }}
          CLIENT_FILE: ${{ matrix.fileName }}
          CLIENT_SHA: ${{ matrix.sha256 }}
          CLIENT_VERSION: ${{ matrix.version }}
          CLIENT_REVISION: ${{ matrix.sourceRevision }}
          CLIENT_LANGUAGE: ${{ matrix.language }}
          CLIENT_PUBLISHED: ${{ matrix.published }}
          EXPECT_INCOMPATIBLE: ${{ matrix.expectIncompatible }}
          REQUIRED_OPTIONAL_SCENARIOS: ${{ toJSON(matrix.requiredOptionalScenarios) }}
          CLIENT_CONTRACT_MAJOR: ${{ matrix.requiredContract.major }}
          SA_TARGET: ${{ matrix.target }}
          SERVER_VERSION: ${{ inputs.server-version }}
          # The packaged runner copies a failing scenario's full client output
          # and server logs here.
          BRIOSA_CONFORMANCE_DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}/conformance-diagnostics
          # For each scenario whose server log holds diagnostic codes or operation
          # IDs that the digest vocabulary does not list, the runner appends the
          # scenario, the property and a count, never the value.
          BRIOSA_CONFORMANCE_DIGEST_AUDIT: ${{ github.workspace }}/conformance-digest-audit.txt
          # A soak run also takes heap dumps of the .NET processes at a fixture timeout and,
          # for a JavaScript client, traces its gRPC calls; the gate leaves both off. A soak of one
          # scenario runs a soak package, whose runner repeats that scenario only and
          # ends every run with an error, so no compatibility evidence is written.
          BRIOSA_CONFORMANCE_CLIENT_TRACE: ${{ inputs.soak-iterations > 0 && matrix.language == 'js' && 'js' || '' }}
          BRIOSA_CONFORMANCE_DUMP_ON_TIMEOUT: ${{ inputs.soak-iterations > 0 && '1' || '' }}
          SOAK_SCENARIO: ${{ inputs.soak-iterations > 0 && inputs.soak-scenario || '' }}
        run: |
          Import-Module ./eng/RetainedClientPolicy.psm1
          if ($env:CLIENT_PUBLISHED -eq 'true') {
            $package = Join-Path $PWD $env:CLIENT_FILE
            Invoke-WebRequest $env:CLIENT_URL -OutFile $package
            if ((Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:CLIENT_SHA) { throw 'Client artifact digest mismatch.' }
          }
          else {
            $pattern = @{ dotnet = 'artifacts/package/*.nupkg'; js = '*.tgz'; py = 'dist/*.whl' }[$env:CLIENT_LANGUAGE]
            $packages = @(Get-ChildItem "retained-client/targets/$env:SA_TARGET/$pattern" -File)
            if ($packages.Count -ne 1) { throw 'Expected one source candidate package.' }
            $package = $packages[0].FullName
            $env:CLIENT_SHA = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $name = "briosa-client-conformance-$env:SERVER_VERSION-sa-$env:SA_TARGET-win-x64"
          $artifact = Join-Path $PWD "server-artifacts/$name.zip"
          $provenance = Get-Content "server-artifacts/$name.provenance.json" -Raw | ConvertFrom-Json
          if ($provenance.sourceRevision -cne $env:GITHUB_SHA -or $provenance.briosaVersion -cne $env:SERVER_VERSION -or $provenance.spatialAnalyzerTarget -cne $env:SA_TARGET) {
            throw 'Conformance product does not belong to this server build.'
          }
          $lock = @{
            schema_version = 1
            artifact = @{
              name = $name; file_name = "$name.zip"; sha256 = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
              briosa_version = $provenance.briosaVersion; source_revision = $provenance.sourceRevision
              source_repository = 'https://github.com/spatialanalyzer/briosa'; source_channel = 'release_candidate'
            }
            target = @{ spatial_analyzer = $env:SA_TARGET; runtime_identifier = 'win-x64' }
            contract = @{ id = $provenance.scenarioContract; schema_version = $provenance.scenarioContractSchemaVersion }
          }
          $lockPath = Join-Path $PWD 'server-lock.json'
          $lock | ConvertTo-Json -Depth 10 | Set-Content $lockPath -Encoding utf8
          $arguments = @{
            ClientPackagePath = $package; ClientPackageSha256 = $env:CLIENT_SHA; ClientVersion = $env:CLIENT_VERSION
            PublishedPackageUrl = $env:CLIENT_URL; ArtifactPath = $artifact; LockPath = $lockPath
            EvidencePath = (Join-Path $PWD 'compatibility-evidence.json')
            ClientSourceRevision = $env:CLIENT_REVISION
            RequiredContractMajor = [int]$env:CLIENT_CONTRACT_MAJOR
            ExpectIncompatible = $env:EXPECT_INCOMPATIBLE -eq 'true'
          }
          # Fixture source and package source are separately pinned. The fixture
          # uses the public API from an isolated verified package installation.
          Push-Location (Join-Path $PWD "retained-client/targets/$env:SA_TARGET")
          # The policy lists the optional scenarios, such as large-result, that
          # this job's fixture requests. An accepted job fails unless the runner's
          # own pass line shows each of them exactly once, whichever client
          # version it tests, and from client 0.5.0 on the list must include
          # large-result. A rejection lists none.
          try {
            $runnerOutput = [Collections.Generic.List[string]]::new()
            $soakEnd = $null
            try {
              & ./eng/Test-PublishedClientConformance.ps1 @arguments 6>&1 | ForEach-Object {
                $runnerOutput.Add([string]$_)
                $_
              }
            }
            catch {
              if ([string]::IsNullOrEmpty($env:SOAK_SCENARIO)) { throw }
              $soakEnd = "$_"
            }
            if ([string]::IsNullOrEmpty($env:SOAK_SCENARIO)) {
              Assert-OptionalScenarioPasses -RequiredScenarioJson $env:REQUIRED_OPTIONAL_SCENARIOS -RunnerOutput $runnerOutput.ToArray() -ClientVersion $env:CLIENT_VERSION -ExpectIncompatible $arguments.ExpectIncompatible
            }
            else {
              Assert-SoakScenarioPass -Scenario $env:SOAK_SCENARIO -RunnerOutput $runnerOutput.ToArray() -RunEnd $soakEnd
            }
          }
          finally { Pop-Location }
      - name: Check the conformance digest vocabulary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # A value the digest does not list prints as <withheld>. The audit holds
          # only counts, so this log never shows the value itself.
          $audit = Join-Path $env:GITHUB_WORKSPACE 'conformance-digest-audit.txt'
          if ((Test-Path -LiteralPath $audit) -and (Get-Item -LiteralPath $audit).Length -gt 0) {
            Get-Content -LiteralPath $audit | ForEach-Object { Write-Host $_ }
            throw ('The conformance scenarios produced diagnostic codes or operation IDs that the digest vocabulary does not list (scenario, property, count above). ' +
              'CI does not show the values. To find them on your own machine, compare targets/<target>/conformance/client/v1/digest-vocabulary.json ' +
              'with the kebab-case diagnostic code literals in targets/<target>/src and targets/<target>/tests/Briosa.SmokeWorker, ' +
              'with the codes WorkerProcessSupervisor.StopDiagnosticCode composes, and with the operation IDs the named scenario calls. ' +
              'Review each missing value and add it to the vocabulary in both targets. If a producer writes sensitive data into DiagnosticCode ' +
              'or OperationId, correct the producer instead.')
          }
      # A soak run is not compatibility evidence.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.soak-iterations == 0
        with:
          name: compatibility-${{ matrix.language }}-${{ matrix.target }}-${{ matrix.version }}
          path: compatibility-evidence.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: conformance-diagnostics-${{ matrix.language }}-${{ matrix.target }}-${{ matrix.version }}${{ matrix.iteration && format('-iteration-{0}', matrix.iteration) || '' }}
          path: conformance-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      # The job's status so far covers every step before this one, the vocabulary
      # check included.
      - name: Record the soak iteration
        if: always() && inputs.soak-iterations > 0
        shell: pwsh
        env:
          ITERATION: ${{ matrix.iteration }}
          STATUS: ${{ job.status }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          # Each failing scenario's diagnostics are in a directory named after it; a
          # timeout also left the census of the fixture's process tree.
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'conformance-diagnostics'
          $failed = @(if (Test-Path -LiteralPath $diagnostics) {
              Get-ChildItem -LiteralPath $diagnostics -Directory | Sort-Object Name | ForEach-Object {
                [ordered]@{ scenario = $_.Name; timedOut = Test-Path -LiteralPath (Join-Path $_.FullName 'timeout-processes.txt') }
              }
            })
          $result = [ordered]@{ iteration = [int]$env:ITERATION; status = $env:STATUS; verify = $env:VERIFY; failed = $failed }
          $result | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'soak-result.json') -Encoding utf8
          $scenarios = ($failed | ForEach-Object { "$($_.scenario)$(if ($_.timedOut) { ' (timed out)' })" }) -join ', '
          "Iteration $($env:ITERATION): $($env:STATUS) (verification $($env:VERIFY))$(if ($scenarios) { ", failed: $scenarios" })" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.soak-iterations > 0
        with:
          name: soak-result-${{ matrix.iteration }}
          path: soak-result.json
          if-no-files-found: error
          retention-days: 14
  gate:
    needs:
      - policy
      - conformance
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          POLICY: ${{ needs.policy.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
        run: |
          if ($env:POLICY -ne 'success' -or $env:CONFORMANCE -ne 'success') {
            throw 'Retained-client compatibility gate failed.'
          }
