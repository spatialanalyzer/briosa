  rpc RunCribSheet(RunCribSheetRequest) returns (RunCribSheetResult);
  // MP result details retain the raw result code, including partial projection outcomes.
  rpc ProjectObjects(ProjectObjectsRequest) returns (ProjectObjectsResult);
  // Independent stop request; no prior request from this caller is required.
  rpc StopProjection(StopProjectionRequest) returns (StopProjectionResult);
  rpc LocateInstrumentsUsmn(LocateInstrumentsUsmnRequest) returns (LocateInstrumentsUsmnResult);
