syntax = "proto3";

package briosa;

option csharp_namespace = "Briosa";

// Describes whether the MP command itself completed successfully.
enum MpExecutionState {
  MP_EXECUTION_STATE_UNSPECIFIED = 0;
  MP_EXECUTION_STATE_SUCCEEDED = 1;
  MP_EXECUTION_STATE_EXECUTE_STEP_REJECTED = 2;
  MP_EXECUTION_STATE_FAILED = 3;
  MP_EXECUTION_STATE_RESULT_UNAVAILABLE = 4;
  MP_EXECUTION_STATE_ARGUMENT_REJECTED = 5;
  // SpatialAnalyzer returned MP code 4 (PARTIAL SUCCESS): the command did its
  // work but did not have its full intended effect. The call is a completed
  // success with its outputs, so do not replay it. An operation whose target
  // documentation says code 4 leaves the work undone reports it as FAILED.
  MP_EXECUTION_STATE_PARTIAL_SUCCESS = 6;
}

// Describes what happened when Briosa requested one result-only argument.
enum OutputRetrievalState {
  OUTPUT_RETRIEVAL_STATE_UNSPECIFIED = 0;
  OUTPUT_RETRIEVAL_STATE_RETRIEVED = 1;
  OUTPUT_RETRIEVAL_STATE_NOT_ATTEMPTED = 2;
  OUTPUT_RETRIEVAL_STATE_FAILED = 3;
}

// States what Briosa can prove about whether the MP command ran.
enum ExecutionDisposition {
  EXECUTION_DISPOSITION_UNSPECIFIED = 0;
  EXECUTION_DISPOSITION_NOT_STARTED = 1;
  EXECUTION_DISPOSITION_STARTED_OUTCOME_UNKNOWN = 2;
  EXECUTION_DISPOSITION_COMPLETED = 3;
}

// Describes the availability action independently from replaying the command.
enum RecoveryGuidance {
  RECOVERY_GUIDANCE_UNSPECIFIED = 0;
  RECOVERY_GUIDANCE_NONE = 1;
  RECOVERY_GUIDANCE_WAIT_FOR_READINESS = 2;
  RECOVERY_GUIDANCE_WORKER_REPLACEMENT = 3;
  RECOVERY_GUIDANCE_OPERATOR_INTERVENTION_REQUIRED = 4;
}

// Tells a client whether issuing the same command again is appropriate.
enum ReplayGuidance {
  REPLAY_GUIDANCE_UNSPECIFIED = 0;
  REPLAY_GUIDANCE_DO_NOT_REPLAY = 1;
  REPLAY_GUIDANCE_MAY_REPLAY = 2;
  REPLAY_GUIDANCE_RECONCILE_BEFORE_REPLAY = 3;
}

// Records the reviewed exact-target replay classification for an operation.
enum ReplaySafety {
  REPLAY_SAFETY_UNSPECIFIED = 0;
  REPLAY_SAFETY_SAFE = 1;
  REPLAY_SAFETY_UNSAFE = 2;
  REPLAY_SAFETY_UNKNOWN = 3;
}

// Classifies one failed operation independently of its gRPC status code.
enum OperationFailureKind {
  OPERATION_FAILURE_KIND_UNSPECIFIED = 0;
  OPERATION_FAILURE_KIND_VALIDATION = 1;
  OPERATION_FAILURE_KIND_UNSUPPORTED = 2;
  OPERATION_FAILURE_KIND_SPATIAL_ANALYZER_UNAVAILABLE = 3;
  OPERATION_FAILURE_KIND_WORKER_UNAVAILABLE = 4;
  OPERATION_FAILURE_KIND_CALLER_CANCELLED = 5;
  OPERATION_FAILURE_KIND_CALLER_DEADLINE_EXCEEDED = 6;
  OPERATION_FAILURE_KIND_WORKER_WATCHDOG_TIMEOUT = 7;
  OPERATION_FAILURE_KIND_WORKER_FAILURE = 8;
  OPERATION_FAILURE_KIND_EXECUTE_STEP_REJECTED = 9;
  OPERATION_FAILURE_KIND_MP_FAILURE = 10;
  OPERATION_FAILURE_KIND_OUTPUT_RETRIEVAL_FAILURE = 11;
  OPERATION_FAILURE_KIND_INTERNAL = 12;
  OPERATION_FAILURE_KIND_POLICY_DENIED = 13;
  OPERATION_FAILURE_KIND_MP_RESULT_RETRIEVAL_FAILURE = 14;
  OPERATION_FAILURE_KIND_SDK_ARGUMENT_REJECTED = 15;
  // Admission rejected the request before mapping or dispatch. No automatic retry.
  OPERATION_FAILURE_KIND_OVERLOADED = 16;
  // An SDK call threw during the MP sequence. The execution disposition carries
  // the proven phase: NOT_STARTED before ExecuteStep, STARTED_OUTCOME_UNKNOWN
  // during ExecuteStep or MP result retrieval, and COMPLETED when an output
  // getter threw after MP success. No automatic retry.
  OPERATION_FAILURE_KIND_SDK_CALL_FAULTED = 17;
}

// Records retrieval state by the public operation result field name.
message OutputRetrievalDetails {
  string field_name = 1;
  OutputRetrievalState state = 2;
  optional string diagnostic_code = 3;
}

// Accompanies every successful MP result and MP-related error detail.
message MpExecutionDetails {
  MpExecutionState state = 1;
  optional int32 mp_result_code = 2;
  repeated OutputRetrievalDetails output_retrievals = 3;
}

// The step of the active admission policy that denied a call or an operation.
// Each value up to UNREVIEWED names the same step as one denied value of
// OperationAdmission in discovery: PROFILE and DENIED_PROFILE, FLAG and
// DENIED_FLAG, OVERRIDE and DENIED_OVERRIDE, EXCLUSIVE and DENIED_EXCLUSIVE,
// UNREVIEWED and DENIED_UNREVIEWED. The numbers differ, so match the two enums
// by name. The CALLER_ values name the caller's own restriction, which only a
// call carries, so discovery has no matching value.
enum PolicyDenialRule {
  POLICY_DENIAL_RULE_UNSPECIFIED = 0;
  // The profile, widened by flags set to allow, does not admit every risk flag,
  // or the read-only effect filter excludes the operation.
  POLICY_DENIAL_RULE_PROFILE = 1;
  // A risk flag is set to deny.
  POLICY_DENIAL_RULE_FLAG = 2;
  // A per-operation override is set to deny.
  POLICY_DENIAL_RULE_OVERRIDE = 3;
  // An exclusive workflow, which no setting admits in the current isolation
  // mode. A request whose options leave work running after the call returns is one.
  POLICY_DENIAL_RULE_EXCLUSIVE = 4;
  // The operation's classification metadata is not reviewed, or the request
  // cannot be read against the operation's reviewed request options.
  POLICY_DENIAL_RULE_UNREVIEWED = 5;
  // The server's configuration admitted the call, and the profile named by the
  // caller's own briosa-caller-restriction request header does not admit every
  // effective risk flag of the request, or its read-only effect filter excludes
  // the operation. No flag set to allow and no override widens the caller's
  // profile. Server 0.10.2 and later.
  POLICY_DENIAL_RULE_CALLER_PROFILE = 6;
  // The server's configuration admitted the call, and the caller's own
  // briosa-caller-restriction request header denies one of the request's
  // effective risk flags. Server 0.10.2 and later.
  POLICY_DENIAL_RULE_CALLER_FLAG = 7;
}

// Value-free detail of a policy denial, shared by a denied call and by
// discovery. Server 0.10.1 and later send it. Server 0.10.0 does not, and
// clients built for Server 0.10.0, such as the 0.5.0 clients, ignore it.
// Discovery never reports a CALLER_ rule.
message PolicyDenialDetails {
  PolicyDenialRule rule = 1;
  // The risk flag set to deny that decided, as the lowercase suffix of its
  // OperationRiskFlag value name: for example "physical_motion" for
  // OPERATION_RISK_FLAG_PHYSICAL_MOTION. Present exactly when rule is FLAG, and
  // never "unspecified". When several of the request's flags are set to deny,
  // it names the first in OperationRiskFlag declaration order. A newer server
  // can name a flag that an older client does not know.
  optional string denied_flag = 2;
  // The protobuf field name of the request option the server attributed the
  // denial to, for example "show_results_dialog"; never a request value. When a
  // request turns on several options with the deciding effect, it names the
  // first in the server's reviewed order, which need not be the only cause.
  // Absent when the operation's reviewed row decided, and when the request could
  // not be read against its reviewed options. The CALLER_ rules set it in the
  // same way.
  optional string request_option_field = 3;
  // The active admission profile: read-only, standard, device, or full.
  // Present exactly when rule is PROFILE.
  optional string admission_profile = 4;
  // The profile the caller's own restriction named: read-only, standard,
  // device, or full. Present exactly when rule is CALLER_PROFILE. It is never the
  // server's profile, which admitted the call. Server 0.10.2 and later.
  optional string caller_admission_profile = 5;
  // The risk flag the caller's own restriction denied that decided, as the
  // lowercase suffix of its OperationRiskFlag value name, like denied_flag.
  // Present exactly when rule is CALLER_FLAG. When the caller denies several of
  // the request's flags, it names the first in OperationRiskFlag declaration
  // order. Server 0.10.2 and later.
  optional string caller_denied_flag = 6;
}

// The constraint a request field did not meet. Each value names one kind of
// check the server makes while it reads a request, before anything is
// dispatched. A newer server can send a value that an older client does not
// know; such a client can still use field_path.
enum RequestFieldConstraint {
  REQUEST_FIELD_CONSTRAINT_UNSPECIFIED = 0;
  // The field must be set, and it is absent. It is a message field, or a
  // field with explicit presence (proto3 optional) whose presence the
  // operation checks. Some fields are required only when another field of the
  // request turns on the behavior that uses them.
  REQUEST_FIELD_CONSTRAINT_REQUIRED = 1;
  // The string must contain a character other than whitespace. An operation
  // that does not check a string's presence reads an absent string as empty,
  // so an absent string can fail this check instead of REQUIRED.
  REQUEST_FIELD_CONSTRAINT_NOT_BLANK = 2;
  // The repeated field must have at least one element.
  REQUEST_FIELD_CONSTRAINT_NOT_EMPTY = 3;
  // The repeated field must have the exact number of elements the value
  // needs, for example 16 for a transform.
  REQUEST_FIELD_CONSTRAINT_ELEMENT_COUNT = 4;
  // The number must be in the range the target accepts, for example 0 to 255
  // for a color channel.
  REQUEST_FIELD_CONSTRAINT_RANGE = 5;
  // The field must hold a choice this operation supports on this target. For
  // an enum field, a number the schema does not define and a defined value the
  // operation does not accept fail this check. Each operation decides whether
  // UNSPECIFIED fails it: some read UNSPECIFIED as the operation's default. A
  // string field that names a target choice, such as an instrument type name,
  // fails it for a name the target does not define.
  REQUEST_FIELD_CONSTRAINT_SUPPORTED_CHOICE = 6;
  // One field of a oneof must be set. field_path names the message that holds
  // the oneof.
  REQUEST_FIELD_CONSTRAINT_ONEOF_REQUIRED = 7;
}

// Value-free detail of a request that failed validation: which field, and
// which constraint. It never carries the value the request sent.
message RequestValidationDetails {
  // The request field, as protobuf field names separated by dots from the
  // request message down, for example "point_name.target_name". A path through
  // a repeated message field names the element's field without an index, for
  // example "objects.object_type" for any element of objects.
  string field_path = 1;
  RequestFieldConstraint constraint = 2;
}

// Typed, value-free detail carried in briosa-operation-error-bin metadata.
message OperationError {
  reserved 4;
  reserved "retry_guidance";

  string operation_id = 1;
  OperationFailureKind kind = 2;
  string diagnostic_code = 3;
  optional int32 worker_generation = 5;
  optional MpExecutionDetails mp_execution = 6;
  ExecutionDisposition execution_disposition = 7;
  RecoveryGuidance recovery_guidance = 8;
  ReplayGuidance replay_guidance = 9;
  ReplaySafety replay_safety = 10;
  // The policy step that denied the call. Server 0.10.1 and later set it on
  // every POLICY_DENIED failure and on no other kind. Server 0.10.0 does not set
  // it, and clients built for Server 0.10.0 ignore it.
  optional PolicyDenialDetails policy_denial = 11;
  // The first request field the server found invalid, and the constraint it
  // did not meet. Server 0.10.2 and later set it only on VALIDATION failures,
  // and only when the failed check belongs to one request field; other
  // validation failures leave it absent. The server stops at the first invalid
  // field, so the request can have others. Earlier servers do not set it, and
  // clients built for them ignore it.
  optional RequestValidationDetails request_validation = 12;
}
