syntax = "proto3";

package briosa.sa.v2026_1_0529_7.v1alpha1;

import "briosa/core/v1alpha1/operation_outcomes.proto";

option csharp_namespace = "Briosa.Sa.V2026_1_0529_7.V1Alpha1";

service FileOperations {
  // Executes the "Get Working Directory" MP command.
  rpc GetWorkingDirectory(GetWorkingDirectoryRequest) returns (GetWorkingDirectoryResult);
}

message GetWorkingDirectoryRequest {}

message GetWorkingDirectoryResult {
  // The MP return argument named "Directory".
  optional string directory = 1;
  // Explicit MP and result-only argument retrieval outcome.
  briosa.core.v1alpha1.MpExecutionDetails execution = 1000;
}
