syntax = "proto3";

package briosa.sa.v2026_1_0529_7.v1alpha1;

import "briosa/sa/v2026_1_0529_7/v1alpha1/specialized_values.proto";

option csharp_namespace = "Briosa.Sa.V2026_1_0529_7.V1Alpha1";

// Identifies a point by the three name components used by this exact
// SpatialAnalyzer target. It is not a Cartesian coordinate.
message PointName {
  optional string collection_name = 1;
  optional string group_name = 2;
  optional string target_name = 3;
}

// Identifies an instrument by its containing collection and numeric identifier.
message CollectionInstrumentId {
  optional string collection_name = 1;
  optional int32 instrument_id = 2;
}

// Identifies a machine by its containing collection and numeric identifier.
// This remains distinct from CollectionInstrumentId even though the primitive
// component shapes are identical.
message CollectionMachineId {
  optional string collection_name = 1;
  optional int32 machine_id = 2;
}

// Identifies a collection object. All three components are required by the
// exact-target setter and are returned by the exact-target getter.
message CollectionObjectName {
  optional string collection_name = 1;
  optional string object_name = 2;
  // Retained only for v1alpha1 wire/source compatibility. Generated operations
  // never accept or populate this untyped field.
  optional string object_type = 3 [deprecated = true];
  optional ObjectType exact_object_type = 4;
}

// Identifies any named collection item, including non-geometric entities such
// as reports, annotations, dimensions, events, and calibration appliance nodes.
message CollectionItemName {
  optional string collection_name = 1;
  optional string item_name = 2;
  optional ItemType item_type = 3;
}

// Identifies a group by collection and group name.
message CollectionGroupName {
  optional string collection_name = 1;
  optional string group_name = 2;
}

// Identifies a vector group by collection and vector-group name.
message CollectionVectorGroupName {
  optional string collection_name = 1;
  optional string vector_group_name = 2;
}

// Identifies a vector by collection, vector group, and vector name.
message VectorName {
  optional string collection_name = 1;
  optional string group_name = 2;
  optional string name = 3;
}

message CollectionInstrumentIdList {
  repeated CollectionInstrumentId values = 1;
}

message CollectionGroupNameList {
  repeated CollectionGroupName values = 1;
}

message CollectionObjectNameList {
  repeated CollectionObjectName values = 1;
}

message CollectionItemNameList {
  repeated CollectionItemName values = 1;
}

message CollectionVectorGroupNameList {
  repeated CollectionVectorGroupName values = 1;
}

message PointNameList {
  repeated PointName values = 1;
}

message StringList {
  repeated string values = 1;
}

// Preserves an ordered array of double-precision values.
message DoubleArray {
  repeated double values = 1;
}

// Carries the exact 4x4 affine transform used by SpatialAnalyzer. Values are
// ordered by row, then column, and exactly 16 values are required.
message Transform {
  repeated double values = 1;
}

// Carries a SpatialAnalyzer world transform and its independent scale factor.
message WorldTransform {
  Transform transform = 1;
  optional double scale_factor = 2;
}

// Carries 8-bit red, green, and blue channels. Protobuf uses uint32 because it
// has no byte scalar; each channel must be in the inclusive range 0..255.
message RgbColor {
  optional uint32 red = 1;
  optional uint32 green = 2;
  optional uint32 blue = 3;
}

// Preserves both parts of the exact SpatialAnalyzer file-path argument.
// Paths are sensitive operational data and must not be logged by default.
message FileReference {
  optional string path = 1;
  optional bool embedded_file = 2;
}

// Carries the exact font name, byte-sized point size, and RGB color accepted
// by SpatialAnalyzer.
message Font {
  optional string font_name = 1;
  optional uint32 size = 2;
  RgbColor color = 3;
}

enum AngularUnit {
  ANGULAR_UNIT_UNSPECIFIED = 0;
  ANGULAR_UNIT_DEGREES = 1;
  ANGULAR_UNIT_DEGREES_MINUTES_SECONDS = 2;
  ANGULAR_UNIT_RADIANS = 3;
  ANGULAR_UNIT_MILLIRADIANS = 4;
  ANGULAR_UNIT_GONS_GRAD = 5;
  ANGULAR_UNIT_MILS = 6;
  ANGULAR_UNIT_ARCSECONDS = 7;
  ANGULAR_UNIT_DEGREES_MINUTES = 8;
}

enum DistanceUnit {
  DISTANCE_UNIT_UNSPECIFIED = 0;
  DISTANCE_UNIT_METERS = 1;
  DISTANCE_UNIT_CENTIMETERS = 2;
  DISTANCE_UNIT_MILLIMETERS = 3;
  DISTANCE_UNIT_FEET = 4;
  DISTANCE_UNIT_INCHES = 5;
  DISTANCE_UNIT_US_SURVEY_FEET = 6;
}

enum TemperatureUnit {
  TEMPERATURE_UNIT_UNSPECIFIED = 0;
  TEMPERATURE_UNIT_FAHRENHEIT = 1;
  TEMPERATURE_UNIT_CELSIUS = 2;
}

message VectorNameList {
  repeated VectorName values = 1;
}

// Carries three numeric components. The owning target-scoped command field
// determines whether they represent coordinates, a direction, weights, or
// another SpatialAnalyzer concept.
message Vector3 {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

// Preserves both the enable flag and numeric value returned by SpatialAnalyzer.
// A disabled limit is present and is not equivalent to an absent limit.
message ToleranceLimit {
  optional bool enabled = 1;
  optional double value = 2;
}

// Preserves the complete vector-tolerance shape for this exact target.
message ToleranceVectorOptions {
  ToleranceLimit high_x = 1;
  ToleranceLimit high_y = 2;
  ToleranceLimit high_z = 3;
  ToleranceLimit high_magnitude = 4;
  ToleranceLimit low_x = 5;
  ToleranceLimit low_y = 6;
  ToleranceLimit low_z = 7;
  ToleranceLimit low_magnitude = 8;
}
